<style>
:root{
  --rojo:#9D202F; --negro:#1E1E1E; --burdeos:#28090A; --crema:#FFFEF1; --arena:#CAC59D; --tierra:#B7997B; --sand:#EDE9D3;
  --verde:#2E7D4F; --gris:#6B6459; --linea:#E3DFC8; --blanco:#FFFFFF;
  --sombra:0 1px 2px rgba(40,9,10,.06), 0 6px 18px rgba(40,9,10,.05);
  --fTit:'Montserrat',system-ui,sans-serif; --fTxt:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--fTxt);color:var(--negro);background:var(--crema);font-size:14px;line-height:1.45}
h1,h2,h3,h4{font-family:var(--fTit);font-weight:600;margin:0;color:var(--burdeos)}
h1{font-size:22px} h2{font-size:17px} h3{font-size:14px}
a{color:var(--rojo)}
button{font-family:var(--fTxt)}
.oculto{display:none!important}

/* ---------- login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--burdeos);padding:20px}
#login .caja{background:var(--crema);border-radius:14px;padding:32px 30px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
#login img{width:200px;display:block;margin:0 auto 18px}
#login h1{text-align:center;font-size:18px;margin-bottom:4px}
#login p.sub{text-align:center;color:var(--gris);margin:0 0 18px;font-size:13px}
.campo{display:block;margin-bottom:12px}
.campo span{display:block;font-size:12px;color:var(--gris);margin-bottom:4px}
input,select,textarea{font-family:var(--fTxt);font-size:14px;padding:9px 11px;border:1px solid var(--arena);border-radius:8px;background:var(--blanco);color:var(--negro);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(157,32,47,.25);border-color:var(--rojo)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;border:1px solid var(--rojo);background:var(--rojo);color:#fff;font-weight:600;font-size:13px;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{background:#86192a}
.btn.sec{background:transparent;color:var(--rojo)}
.btn.sec:hover{background:rgba(157,32,47,.07)}
.btn.osc{background:var(--burdeos);border-color:var(--burdeos)}
.btn.chico{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ancho{width:100%;justify-content:center}
.error{background:#FBE9EC;border:1px solid #E9B3BB;color:#7a1522;padding:9px 12px;border-radius:8px;font-size:13px;margin:10px 0}
.aviso{background:#FFF6D6;border:1px solid #E9D48A;color:#5d4a00;padding:9px 12px;border-radius:8px;font-size:13px;margin:10px 0}
.ok{background:#E6F3EA;border:1px solid #A9D5B6;color:#1d5a34;padding:9px 12px;border-radius:8px;font-size:13px;margin:10px 0}

/* ---------- app shell */
#app{display:flex;min-height:100vh}
#lateral{width:230px;flex:0 0 230px;background:var(--burdeos);color:#fff;display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh}
#lateral img{width:180px;margin:4px 0 22px 6px}
#lateral .nav button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;color:rgba(255,255,255,.8);padding:9px 10px;border-radius:8px;font-size:13.5px;cursor:pointer}
#lateral .nav button:hover{background:rgba(255,255,255,.07);color:#fff}
#lateral .nav button.act{background:var(--rojo);color:#fff;font-weight:600}
#lateral .nav .grupo{font-size:11px;letter-spacing:.04em;color:rgba(255,255,255,.45);margin:14px 10px 4px;font-family:var(--fTit)}
#lateral .pie{margin-top:auto;font-size:12px;color:rgba(255,255,255,.7);padding:10px 6px;border-top:1px solid rgba(255,255,255,.12)}
#lateral .pie b{display:block;color:#fff;font-weight:600}
#lateral .pie button{background:none;border:0;color:var(--arena);cursor:pointer;padding:4px 0;font-size:12px;text-decoration:underline}
#topbar{display:none}
#contenido{flex:1;min-width:0;padding:22px 28px 60px}
.cabecera{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.cabecera p{margin:2px 0 0;color:var(--gris);font-size:13px}
.acciones{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acciones select{width:auto}

/* ---------- tarjetas y tablas */
.tarjeta{background:var(--blanco);border:1px solid var(--linea);border-radius:12px;padding:16px 18px;box-shadow:var(--sombra);margin-bottom:14px}
.tarjeta h2{margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.tile{background:var(--sand);border-radius:10px;padding:10px 12px}
.tile .lab{font-size:11.5px;color:var(--gris)}
.tile .val{font-family:var(--fTit);font-weight:600;font-size:17px;color:var(--burdeos);margin-top:2px}
.tile.rojo{background:var(--rojo);color:#fff}.tile.rojo .lab,.tile.rojo .val{color:#fff}
.tile.gris{opacity:.6}
.total-grande{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.total-grande .monto{font-family:var(--fTit);font-weight:600;font-size:36px;color:var(--rojo);letter-spacing:-.01em}
.total-grande .lab{color:var(--gris);font-size:13px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t.det{font-size:11.5px}
table.t.det td,table.t.det th{padding:5px 6px}
.nw{white-space:nowrap}
.sub{display:block;font-size:10.5px;color:var(--gris);font-weight:400}
#folio.pdf{width:740px;max-width:740px;padding:14px 18px}
#folio.pdf .scroll{overflow:hidden}
#folio.pdf table.t{table-layout:fixed;width:100%}
#folio.pdf table.t td,#folio.pdf table.t th{overflow-wrap:break-word;vertical-align:top}
#folio.pdf .chasis{font-size:7px;letter-spacing:-.02em}
#folio.pdf .grid32{grid-template-columns:1fr 1fr}
#folio.pdf table.t{font-size:9px}
#folio.pdf table.t.det{font-size:8px}
#folio.pdf table.t td,#folio.pdf table.t th{padding:3px 4px}
#folio.pdf table.t td,#folio.pdf table.t th{white-space:normal}
#folio.pdf .sub.nw{white-space:normal}
#folio.pdf .sub{font-size:8px}
#folio.pdf .pill{font-size:8.5px;padding:1px 5px}
#folio.pdf .tile .val{font-size:14px}
#folio.pdf .total-grande .monto{font-size:28px}
#folio.pdf h2{font-size:14px}
table.t th{text-align:left;font-family:var(--fTit);font-weight:600;font-size:11.5px;color:var(--burdeos);background:var(--sand);padding:7px 8px;border-bottom:1px solid var(--arena);white-space:nowrap}
table.t td{padding:6px 8px;border-bottom:1px solid var(--linea);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.t tr.total td{font-weight:600;background:#FBF9EE;border-top:2px solid var(--arena)}
table.t tr.clic{cursor:pointer}table.t tr.clic:hover td{background:#FBF9EE}
.scroll{overflow-x:auto}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--sand);color:var(--burdeos);white-space:nowrap}
.pill.ok{background:#E6F3EA;color:#1d5a34}.pill.no{background:#FBE9EC;color:#7a1522}.pill.neu{background:#EEE;color:#555}
.pill.rojo{background:var(--rojo);color:#fff}
.chk{color:var(--verde);font-weight:700}.cruz{color:var(--rojo);font-weight:700}
.muted{color:var(--gris)} .peq{font-size:12px} .der{text-align:right}
.fila{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fila .campo{flex:1;min-width:160px;margin:0}
.barra{height:8px;background:var(--sand);border-radius:4px;overflow:hidden;margin-top:4px}
.barra i{display:block;height:100%;background:var(--rojo)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid32{display:grid;grid-template-columns:3fr 2fr;gap:14px}
.grid32 table.t th{white-space:normal}
.vacio{padding:30px;text-align:center;color:var(--gris)}
.drop{border:2px dashed var(--arena);border-radius:12px;padding:30px;text-align:center;color:var(--gris);background:var(--blanco);cursor:pointer}
.drop.sobre{border-color:var(--rojo);background:#FFF5F6}
.log{font-family:ui-monospace,monospace;font-size:12px;background:var(--burdeos);color:#f3eee0;padding:12px;border-radius:8px;max-height:260px;overflow:auto;white-space:pre-wrap}
.bloque{border:1px solid var(--linea);border-radius:10px;padding:12px;margin-bottom:10px;background:#FFFDF6}
.bloque h3{margin-bottom:6px}
.kpi-eq{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.nota{font-size:12px;color:var(--gris);margin-top:6px}
textarea{min-height:120px;font-family:ui-monospace,monospace;font-size:12px}
.seccion-titulo{display:flex;align-items:center;gap:10px;margin:18px 0 8px}
.seccion-titulo .num{width:26px;height:26px;border-radius:50%;background:var(--rojo);color:#fff;font-family:var(--fTit);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 26px}
.seccion-titulo h2{color:var(--burdeos)}
.chart-box{position:relative;height:280px}

/* ---------- folio */
#folio{background:var(--blanco);border:1px solid var(--linea);border-radius:12px;padding:26px 30px;max-width:980px;box-shadow:var(--sombra)}
#folio .cab{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:3px solid var(--rojo);padding-bottom:14px;margin-bottom:16px}
#folio .cab img{width:190px}
#folio .cab .quien{text-align:right}
#folio .cab .quien h1{font-size:19px;color:var(--rojo)}
#folio .cab .quien div{font-size:12.5px;color:var(--gris)}
#folio .glosario dt{font-weight:600;font-size:12px;margin-top:6px}
#folio .glosario dd{margin:0;font-size:12px;color:var(--gris)}
#folio .legal{margin-top:18px;padding-top:10px;border-top:1px solid var(--arena);font-size:11px;color:var(--gris)}
.liq{display:grid;grid-template-columns:1fr auto;gap:4px 18px;max-width:420px;margin-left:auto;font-size:13px}
.liq div.n{text-align:right;font-variant-numeric:tabular-nums}
.liq .tot{font-weight:700;color:var(--rojo);border-top:2px solid var(--arena);padding-top:4px;font-size:15px}

@media print{
  body{background:#fff}
  #lateral,#topbar,.acciones,.cabecera,.no-print{display:none!important}
  #contenido{padding:0}
  #folio{border:0;box-shadow:none;max-width:none;padding:0}
  .tarjeta{box-shadow:none}
  @page{margin:12mm}
}
@media print{#folio .scroll{overflow:visible}#folio table.t{font-size:9px}#folio table.t td,#folio table.t th{padding:3px 4px;white-space:normal}}
@media (max-width:900px){
  #app{flex-direction:column}
  #lateral{display:none}
  #topbar{display:flex;align-items:center;justify-content:space-between;background:var(--burdeos);padding:10px 14px;position:sticky;top:0;z-index:5}
  #topbar img{height:30px}
  #topbar select{width:auto;background:var(--crema);font-size:13px;padding:6px 8px}
  #contenido{padding:14px 12px 40px}
  .grid2,.grid32{grid-template-columns:1fr}
  #folio{padding:16px 14px}
  #folio .cab{flex-direction:column}
  #folio .cab .quien{text-align:left}
  .total-grande .monto{font-size:28px}
}

</style>

// ---------- KPIs: metas desde ajustes
function metaDe(segmento, label) {
  var m = S.ajustes['metas_' + segmento.toLowerCase()] || {};
  var k = Object.keys(m).filter(function (x) { return Parsers.norm(x) === Parsers.norm(label); })[0];
  return k ? m[k] : null;
}
function kpiFila(k, segmento) {
  var meta = metaDe(segmento, k.label), resultado = '', estado = '', suma = '';
  if (k.valor != null && /%|TASA|CI|MPP|FORUM|CREDITOS|NUEVOS|USADOS/i.test(Parsers.norm(k.label))) resultado = pct(k.valor, 1); else resultado = k.valor == null ? esc(k.texto.split(':').slice(1).join(':').trim()) : numf(k.valor);
  if (k.num != null && k.den != null) resultado += ' <span class="muted peq">(' + k.num + ' de ' + k.den + ')</span>';
  if (k.bono != null) { suma = (k.bono > 0 ? '+' : '') + pct(k.bono, 1); estado = k.bono > 0 ? '<span class="chk">✔</span>' : '<span class="cruz">✘</span>'; }
  else if (k.aplica != null) { suma = k.aplica ? 'APLICA' : 'NO APLICA'; estado = k.aplica ? '<span class="chk">✔</span>' : '<span class="cruz">✘</span>'; }
  else if (meta && k.valor != null) { estado = k.valor >= meta.meta ? '<span class="chk">✔</span>' : '<span class="cruz">✘</span>'; }
  return '<tr><td>' + esc(k.label) + (meta && meta.texto ? '<div class="muted peq">' + esc(meta.texto) + '</div>' : '') + '</td><td class="n">' + resultado + '</td><td class="n">' + (meta ? pct(meta.meta, 1) : '—') + '</td><td class="n">' + suma + '</td><td style="text-align:center">' + estado + '</td></tr>';
}
function tablaKpis(seg, segmento) {
  if (!seg || !seg.kpis || !seg.kpis.length) return '';
  var info = [], filas = [];
  seg.kpis.forEach(function (k) {
    var L = Parsers.norm(k.label);
    if (/^VENTAS$/.test(L) || /^% /.test(L)) info.push(esc(k.texto)); else filas.push(kpiFila(k, segmento));
  });
  return (info.length ? '<p class="peq"><b>' + info.join('</b> &nbsp;·&nbsp; <b>') + '</b></p>' : '') +
    (filas.length ? '<div class="scroll"><table class="t"><thead><tr><th>Indicador</th><th class="n">Tu resultado</th><th class="n">Meta</th><th class="n">Suma / estado</th><th></th></tr></thead><tbody>' + filas.join('') + '</tbody></table></div>' : '');
}
function liqBloque(items, totalLab, total) {
  var h = '<div class="liq">';
  items.forEach(function (it) { if (it[1] == null) return; h += '<div>' + esc(it[0]) + '</div><div class="n">' + money(it[1]) + '</div>'; });
  h += '<div class="tot">' + esc(totalLab) + '</div><div class="n tot">' + money(total) + '</div></div>';
  return h;
}
function localCorto(l) { return String(l || '').replace(/^Veh[ií]culos\s+/i, ''); }
function credCorto(i) { return String(i || '').replace(/ SERVICIOS FINANCIEROS.*| CONSUMER FINANCE.*| S\.?A\.?$/i, ''); }
function extras(v) { var p = []; if (v.ci && /SI/i.test(v.ci)) p.push('<span class="pill ok">CI</span>'); if (v.mpp_forum) p.push('<span class="pill ok">' + esc(v.mpp_forum) + '</span>'); if (v.web && /SI/i.test(v.web)) p.push('<span class="pill">WEB</span>'); return p.join(' '); }
function tit(n, t) { return '<div class="seccion-titulo"><span class="num">' + n + '</span><h2>' + esc(t) + '</h2></div>'; }

var OPTS_PDF = function (nombre) { return { margin: [8, 7, 10, 7], filename: nombre, image: { type: 'jpeg', quality: 0.9 }, html2canvas: { scale: 1.6, useCORS: true, backgroundColor: '#FFFFFF', scrollY: 0, scrollX: 0 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }, pagebreak: { mode: ['css', 'legacy'], avoid: ['tr', '.tile', '.liq'] } }; };

async function pdfBlobDeFolio(d) {

  var h = '<div class="cabecera"><div><h1>Folios PDF oficiales</h1><p>Opcional: además del folio que genera la app, puedes subir el PDF oficial de cada persona.</p></div><div class="acciones"><select onchange="S.pdfMes=this.value;ir(\'pdfs\')">' + selOpts(pers, 'mes', function (p) { return mesNombre(p.mes); }, mes) + '</select></div></div>';
  h += '<div class="drop" id="drop-pdf" onclick="$(\'file-pdf\').click()">Suelta aquí varios PDF a la vez — el nombre del archivo debe contener el RUT (p. ej. <b>27051358-1.pdf</b> o <b>FOLIO 27.051.358-1 ADRIANA VERA.pdf</b>)<input type="file" id="file-pdf" multiple accept="application/pdf" class="oculto" onchange="pdfsElegidos(this.files)"></div><div id="pdf-log" class="log oculto"></div>';
  h += '<div class="tarjeta"><div class="scroll"><table class="t"><thead><tr><th>Persona</th><th>RUT</th><th>PDF</th><th></th></tr></thead><tbody>' +
    lista.map(function (p) { var f = subidos[p.rut_key]; return '<tr><td>' + esc(p.nombre) + '</td><td class="peq">' + esc(p.rut) + '</td><td>' + (f ? '📎 <a href="#" onclick="abrirPdfOficial(\'' + esc(f.path) + '\');return false">' + esc(f.nombre_archivo || f.path) + '</a> <span class="muted peq">' + fechaCl(f.subido_en) + '</span>' : '<span class="muted">—</span>') + '</td><td class="n"><label class="btn chico sec" style="cursor:pointer">Subir<input type="file" accept="application/pdf" class="oculto" onchange="subirPdf(\'' + p.rut_key + '\',this.files[0])"></label> ' + (f ? '<button class="btn chico sec" onclick="quitarPdf(\'' + p.rut_key + '\',\'' + esc(f.path) + '\')">Quitar</button>' : '') + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
  $('contenido').innerHTML = h;
  var dz = $('drop-pdf');
  ['dragenter', 'dragover'].forEach(function (e) { dz.addEventListener(e, function (ev) { ev.preventDefault(); dz.classList.add('sobre'); }); });
  ['dragleave', 'drop'].forEach(function (e) { dz.addEventListener(e, function (ev) { ev.preventDefault(); dz.classList.remove('sobre'); }); });
  dz.addEventListener('drop', function (ev) { pdfsElegidos(ev.dataTransfer.files); });
}
function logPdf(t) { var l = $('pdf-log'); l.classList.remove('oculto'); l.textContent += t + '\n'; }
async function subirPdf(rk, file, silencioso) {
  if (!file) return;
  var path = S.pdfMes.slice(0, 7) + '/' + rk + '.pdf';
  var up = await sb.storage.from('folios').upload(path, file, { upsert: true, contentType: 'application/pdf' });
  if (up.error) { if (silencioso) throw up.error; alert('No pude subir: ' + up.error.message); return; }
  q(await sb.from('folios_pdf').upsert({ mes: S.pdfMes, rut_key: rk, path: path, nombre_archivo: file.name, subido_por: S.user.id, subido_en: new Date().toISOString() }, { onConflict: 'mes,rut_key' }));
  if (!silencioso) ir('pdfs');
}
async function pdfsElegidos(files) {
  $('pdf-log').textContent = '';
  var ok = 0;
  for (var i = 0; i < files.length; i++) {
    var f = files[i], base = f.name.replace(/\.pdf$/i, '');
    var m = base.match(/(\d{1,2}\.?\d{3}\.?\d{3}-?[\dkK])/);
    var rk = m ? Parsers.rutKey(m[1]) : null;
    var p = rk ? S.personas.filter(function (x) { return x.rut_key === rk; })[0] : null;
    if (!p) { logPdf('✖ ' + f.name + ': no encontré un RUT de persona en el nombre'); continue; }
    try { await subirPdf(rk, f, true); ok++; logPdf('✔ ' + f.name + ' → ' + p.nombre); } catch (e) { logPdf('✖ ' + f.name + ': ' + elErr(e)); }
  }
  logPdf('Listo: ' + ok + ' de ' + files.length + ' subidos.');
  if (ok) setTimeout(function () { ir('pdfs'); }, 1500);
}
async function quitarPdf(rk, path) {
  if (!confirm('¿Quitar el PDF oficial?')) return;
  await sb.storage.from('folios').remove([path]);
  q(await sb.from('folios_pdf').delete().eq('mes', S.pdfMes).eq('rut_key', rk));
  ir('pdfs');
}

// ---------- Ajustes
async function pestana_ajustes(token) {
  var aj = q(await sb.from('ajustes').select('*').order('clave'));
  if (!vigente(token)) return;
  var h = '<div class="cabecera"><div><h1>Ajustes</h1><p>Metas que se muestran en el folio, glosario y texto legal. Formato JSON; se valida al guardar.</p></div></div>';
  aj.forEach(function (a) { h += '<div class="tarjeta"><h2>' + esc(a.clave) + '</h2><p class="peq muted">' + esc(a.descripcion || '') + '</p><textarea id="aj-' + a.clave + '">' + esc(JSON.stringify(a.valor, null, 2)) + '</textarea><div style="margin-top:8px"><button class="btn chico" onclick="guardarAjuste(\'' + a.clave + '\')">Guardar</button> <span id="ajm-' + a.clave + '" class="peq"></span></div></div>'; });
  $('contenido').innerHTML = h;
}
async function guardarAjuste(clave) {
  var t = $('aj-' + clave).value, v;
  try { v = JSON.parse(t); } catch (e) { $('ajm-' + clave).innerHTML = '<span class="cruz">JSON inválido: ' + esc(e.message) + '</span>'; return; }
  try { q(await sb.from('ajustes').update({ valor: v }).eq('clave', clave)); S.ajustes[clave] = v; $('ajm-' + clave).innerHTML = '<span class="chk">Guardado</span>'; } catch (e) { $('ajm-' + clave).innerHTML = '<span class="cruz">' + esc(elErr(e)) + '</span>'; }
}

</script>
